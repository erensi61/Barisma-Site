<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barışalım mı?</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        }
        
        .animated-bg {
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn-transition {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .floating {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="animated-bg min-h-screen flex items-center justify-center p-4 overflow-hidden relative">

    <!-- Card Container -->
    <div id="main-card" class="bg-white/80 backdrop-blur-md p-8 md:p-12 rounded-3xl shadow-2xl max-w-lg w-full text-center border border-white/50 relative z-10 floating">
        
        <!-- Icon / Emoji Header (Fixed as pleading face emoji) -->
        <div id="emoji-header" class="text-6xl md:text-7xl mb-6">
            🥺
        </div>

        <!-- Title -->
        <h1 id="question-title" class="text-3xl md:text-4xl font-extrabold text-gray-800 mb-4 tracking-tight">
            Barışalım mı?
        </h1>

        <!-- Subtitle message (Dynamic swearing / pleading text) -->
        <p id="sub-message" class="text-gray-600 mb-8 text-base md:text-lg min-h-[56px] flex items-center justify-center">
            Seni kırdığım için gerçekten çok üzgünüm.
        </p>

        <!-- Buttons Container -->
        <div class="flex items-center justify-center gap-4 min-h-[120px] relative" id="buttons-container">
            <!-- YES Button (No Emoji) -->
            <button id="yes-btn" class="btn-transition bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-full shadow-lg hover:shadow-emerald-500/40 active:scale-95 text-lg z-20">
                Evet
            </button>

            <!-- NO Button (No Emoji) -->
            <button id="no-btn" class="btn-transition bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 px-8 rounded-full shadow-lg hover:shadow-rose-500/40 text-lg z-30">
                Hayır
            </button>
        </div>

    </div>

    <!-- Success Card (Hidden Initially) -->
    <div id="success-card" class="hidden bg-white/90 backdrop-blur-md p-8 md:p-12 rounded-3xl shadow-2xl max-w-lg w-full text-center border border-white/50 relative z-10 animate-fade-in">
        <div class="text-7xl mb-4">🥰</div>
        <h2 class="text-3xl font-extrabold text-gray-800 mb-4">Harika!</h2>
        <p class="text-gray-600 text-lg mb-6">
            Bunu duyduğuma çok sevindim! Arkadaşlığımız her şeyden önemli.
        </p>
        <div class="inline-block bg-pink-100 text-pink-600 font-semibold px-4 py-2 rounded-full text-sm">
            Sonsuza Kadar Dostluk 🤝
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        const mainCard = document.getElementById('main-card');
        const successCard = document.getElementById('success-card');
        const subMessage = document.getElementById('sub-message');

        let yesScale = 1;
        let noScale = 1;
        let clickCount = 0;

        // Progressively stronger pleading & swearing statements
        const messages = [
            "Bilmiyordum ama...",
            "Gerçekten bilmiyordum bak!",
            "Yemin ederim haberim yoktu...",
            "Vallah bilmiyordum billah bilmiyordum!",
            "Allah belamı versin bilmiyordum!",
            "Ekmek mushaf çarpsın ki haberim yoktu!",
            "İki gözüm önüme aksın ki bilmiyordum!",
            "Kuran çarpsın vallahi bilmiyordum, affet LÜTFEN!"
        ];

        // Function to move NO button, resize buttons, and update message
        function dodgeNoButton() {
            // Update message with progressively stronger swearing
            if (clickCount < messages.length) {
                subMessage.textContent = messages[clickCount];
            } else {
                subMessage.textContent = messages[messages.length - 1];
            }

            clickCount++;
            
            // 1. Expand Yes Button
            yesScale += 0.35;
            yesBtn.style.transform = `scale(${yesScale})`;

            // 2. Shrink No Button
            noScale = Math.max(0.15, noScale - 0.12);
            noBtn.style.transform = `scale(${noScale})`;

            // 3. Move No Button to a random position on screen
            const padding = 50;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.position = 'fixed';
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        // Trigger on click, hover and touch
        noBtn.addEventListener('click', dodgeNoButton);
        noBtn.addEventListener('mouseenter', dodgeNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            dodgeNoButton();
        });

        // YES Button Click Action
        yesBtn.addEventListener('click', () => {
            mainCard.classList.add('hidden');
            successCard.classList.remove('hidden');

            // Trigger Confetti Animation
            const duration = 3 * 1000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            })();
        });
    </script>
</body>
</html>
